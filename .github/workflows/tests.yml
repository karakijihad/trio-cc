name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to main while the first is still running makes the first
# irrelevant — it is testing code nobody will look at again.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both, deliberately. This codebase branches on win32 in places that decide
    # whether a Codex process can be killed at all (taskkill /t vs a signal),
    # how the CLI is even spawned (node + the JS entry point beside codex.cmd),
    # and how a pid is identified (CIM vs ps). A green Linux run says nothing
    # about any of it, and Windows is where the author works.
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a result, not a reason to cancel the other —
      # knowing whether a break is platform-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 18.18.0 is the floor package.json's engines field promises — the
        # other two are what the author actually develops against. A green
        # 22/24 run says nothing about whether the promised floor still
        # works, and nothing else in this matrix checks it.
        node: [22, 24, "18.18.0"]

    # The suite spawns a fake Codex per lens per pass, hundreds of times. It
    # runs in about two and a half minutes on Linux and considerably longer on
    # a Windows runner, so this is set to catch a hang, not to pace the tests.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step and no cache: Trio has no dependencies, dev or
      # otherwise, and no lockfile to restore. Adding `npm ci` here would fail
      # for the lack of one, and adding a cache would key on a file that does
      # not exist.
      - name: Node and platform
        run: node --version && node -p "process.platform + ' ' + process.arch"

      # package.json's own test script quotes its glob ("tests/**/*.test.mjs")
      # so no shell ever expands it — node --test has to do that itself, and
      # only started supporting glob arguments after Node 18. On 18.18.0 that
      # quoted string is passed straight through as a literal, non-existent
      # path and node --test finds nothing to run. `shell: bash` is what
      # makes the glob below expand identically on both runner OSes — Actions
      # provides Git Bash on windows-latest for exactly this — instead of
      # relying on each platform's default shell (pwsh on Windows does not
      # expand wildcards for a native command's arguments the way bash does).
      - name: Tests (Node 18.18.0 — its test runner can't expand npm test's glob)
        if: matrix.node == '18.18.0'
        shell: bash
        run: node --test tests/*.test.mjs

      - name: Tests
        if: matrix.node != '18.18.0'
        run: npm test
