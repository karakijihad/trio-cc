<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trio</title>
<style>
  html[data-theme="light"] {
    --bg: #f7f6f3;
    --panel: #fffefc;
    --fg: #17191d;
    --dim: #6d7079;
    --faint: #9a9da5;
    --line: #e4e1da;
    --rule: #efece6;
    --ok: #1a7f37;
    --bad: #b3261e;
    --warn: #a35b00;
    --codex: #c2570a;
    --claude: #5a54cf;
    --trio: #6d7079;
    --inset: #f2efe9;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
  }
  html[data-theme="dark"] {
    --bg: #0d0f12;
    --panel: #14171b;
    --fg: #e7e9ec;
    --dim: #8b9099;
    --faint: #656c76;
    --line: #232830;
    --rule: #1c2026;
    --ok: #4ec26f;
    --bad: #f0685f;
    --warn: #e0a34a;
    --codex: #e08a3c;
    --claude: #8f8bf0;
    --trio: #8b9099;
    --inset: #1a1e24;
    --shadow: none;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font:
      12.5px/1.6 ui-monospace,
      SFMono-Regular,
      "SF Mono",
      Menlo,
      Consolas,
      monospace;
    -webkit-font-smoothing: antialiased;
  }

  header {
    height: 44px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    gap: 14px;
    align-items: center;
    box-shadow: var(--shadow);
  }
  h1 {
    font-size: 12px;
    margin: 0;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
  }
  #meta {
    color: var(--dim);
    font-size: 11.5px;
    letter-spacing: 0.02em;
  }
  /* The run is a loop, and which time round it is on changes what the events
     below mean — a finding in pass 3 is one that survived two fix waves. */
  #pass {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--fg);
    background: var(--inset);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  #pass:empty {
    display: none;
  }
  #meta.off {
    color: var(--bad);
  }
  .spacer {
    flex: 1;
  }
  #theme {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition:
      color 0.12s,
      border-color 0.12s,
      background 0.12s;
  }
  #theme:hover {
    color: var(--fg);
    border-color: var(--dim);
    background: var(--inset);
  }
  #theme:focus-visible {
    outline: 2px solid var(--claude);
    outline-offset: 1px;
  }

  /* The run's own lane is a strip under the header, not a column — columns are
     for the agents actually working, so five or six of them fit without a
     horizontal scrollbar. */
  #hood {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    padding: 7px 14px;
    background: var(--inset);
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 11.5px;
    min-height: 32px;
  }
  #hood:empty {
    display: none;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 1px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    white-space: nowrap;
  }
  .chip b {
    font-weight: 500;
    color: var(--fg);
  }
  .chip.good b {
    color: var(--ok);
  }
  .chip.bad b {
    color: var(--bad);
  }

  #lanes {
    display: flex;
    gap: 1px;
    background: var(--line);
    flex: 1;
    min-height: 0;
    overflow-x: auto;
  }
  .lane {
    background: var(--panel);
    min-width: 220px;
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .lane > h2 {
    font-size: 11.5px;
    font-weight: 500;
    margin: 0;
    padding: 9px 12px;
    border-bottom: 1px solid var(--rule);
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 1;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--trio);
    flex: none;
  }
  .lane[data-actor="codex"] .dot {
    background: var(--codex);
  }
  .lane[data-actor="claude"] .dot {
    background: var(--claude);
  }
  .name {
    color: var(--fg);
    letter-spacing: 0.04em;
    flex: none;
  }
  /* The dot already says which agent this is, so the spelled-out actor is what
     gives way first when a lane gets narrow. */
  .role {
    color: var(--faint);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Per lane, because lanes do not move through the passes together: a lens
     that finished pass 2 sits beside one still working through it. */
  .lane-pass {
    color: var(--faint);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    padding: 0 5px;
    border: 1px solid var(--line);
    border-radius: 4px;
    flex: none;
  }
  .lane-pass:empty {
    display: none;
  }
  .tokens {
    margin-left: auto;
    padding-left: 8px;
    color: var(--faint);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .events {
    /* Both of these, or the tail-follow below is a no-op. Without `flex: 1`
       this sizes to its content rather than to the space the lane has left,
       and without `min-height: 0` the flex default of `min-height: auto`
       refuses to shrink it below that content. Either way the element never
       becomes scrollable — scrollHeight equals clientHeight, assigning
       scrollTop does nothing, and the stream quietly grows past the bottom of
       the column instead of following. It only looks correct while a lane's
       events are shorter than the lane. */
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 12px 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    /* Scroll anchoring competes with the tail-follow below: the browser tries
       to hold the reader's position as events arrive, which is the opposite of
       what a live log wants. Pinning is decided here, not by the heuristic. */
    overflow-anchor: none;
  }

  /* A lane only follows its tail while the reader is already at the tail —
     scrolling up to read something has to mean the stream stops moving under
     you. This is the way back, and it only exists while a lane is behind. */
  .jump {
    position: absolute;
    right: 14px;
    bottom: 12px;
    display: none;
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    line-height: 1;
    padding: 5px 9px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .lane.detached .jump {
    display: block;
  }
  .jump:hover {
    color: var(--fg);
    border-color: var(--dim);
  }
  .jump:focus-visible {
    outline: 2px solid var(--claude);
    outline-offset: 1px;
  }
  .events::-webkit-scrollbar {
    width: 9px;
  }
  .events::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 5px;
  }
  .ev {
    margin: 0 0 9px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* Where one pass ends and the next begins, inline in the stream — scrolling
     back through a long lane, the boundary is the thing you are looking for. */
  .pass-rule {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 11px;
    color: var(--faint);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pass-rule::after {
    content: "";
    height: 1px;
    background: var(--rule);
    flex: 1;
  }
  .pass-rule:first-child {
    margin-top: 0;
  }
  .ev.reasoning {
    color: var(--dim);
    border-left: 2px solid var(--rule);
    padding-left: 9px;
  }
  .ev.cmd {
    background: var(--inset);
    border-radius: 5px;
    padding: 6px 9px;
  }
  .sigil {
    color: var(--faint);
    user-select: none;
  }
  .exit {
    font-size: 11px;
    padding: 0 5px;
    margin-left: 8px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
  .exit-0 {
    color: var(--ok);
    background: color-mix(in srgb, var(--ok) 12%, transparent);
  }
  .exit-bad {
    color: var(--bad);
    background: color-mix(in srgb, var(--bad) 14%, transparent);
  }
  .sev {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 6px;
    margin-right: 7px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .sev-critical {
    color: var(--bad);
    background: color-mix(in srgb, var(--bad) 16%, transparent);
  }
  .sev-major {
    color: var(--warn);
    background: color-mix(in srgb, var(--warn) 16%, transparent);
  }
  .sev-minor,
  .sev-info {
    color: var(--dim);
    background: var(--inset);
  }
  .file {
    color: var(--fg);
  }
  .diff {
    margin-top: 5px;
    border-left: 2px solid var(--rule);
    border-radius: 0 4px 4px 0;
    overflow: hidden;
  }
  .diff ins,
  .diff del,
  .diff span {
    display: block;
    text-decoration: none;
    padding: 0 8px;
  }
  .diff ins {
    background: color-mix(in srgb, var(--ok) 14%, transparent);
    color: var(--fg);
  }
  .diff del {
    background: color-mix(in srgb, var(--bad) 14%, transparent);
    color: var(--fg);
  }
  .diff span {
    color: var(--dim);
  }
  .kind {
    color: var(--faint);
  }
  .kind.err {
    color: var(--bad);
  }
  .empty {
    color: var(--faint);
    padding: 24px 14px;
  }
</style>

<header>
  <h1>Trio</h1>
  <span id="meta">connecting…</span>
  <span id="pass"></span>
  <span class="spacer"></span>
  <button id="theme" type="button" aria-live="polite">◐ theme</button>
</header>
<div id="hood"></div>
<div id="lanes"><div class="empty">waiting for the first event…</div></div>

<script>
  // Theme: resolved to a concrete value at boot so the toggle always wins over
  // the OS preference, and remembered per browser.
  const root = document.documentElement;
  const btn = document.getElementById("theme");
  const stored = localStorage.getItem("trio-theme");

  function setTheme(t) {
    root.dataset.theme = t;
    btn.textContent = t === "dark" ? "☀ light" : "☾ dark";
    btn.setAttribute(
      "aria-label",
      "switch to " + (t === "dark" ? "light" : "dark") + " theme",
    );
  }
  // Dark is the shipped default; the toggle's choice is remembered from then on.
  setTheme(stored === "light" ? "light" : "dark");
  btn.addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("trio-theme", next);
    setTheme(next);
  });

  const lanes = new Map();
  const el = document.getElementById("lanes");
  const hood = document.getElementById("hood");
  const meta = document.getElementById("meta");
  const passEl = document.getElementById("pass");
  let count = 0;
  let topPass = 0;

  // Every event carries the pass it belongs to. Pass 0 is the window where a
  // start has claimed the lock but not yet numbered its first pass, and the
  // hook stamps its events with it — real, but not a pass to label.
  const passOf = (ev) =>
    Number.isFinite(ev.pass) && ev.pass > 0 ? ev.pass : null;

  // Highest seen, not most recent. Between passes the marker still names the
  // pass just finished, so Claude's fix-wave events arrive stamped with the
  // older number — and the header must not count backwards when they do.
  function notePass(ev) {
    const p = passOf(ev);
    if (p === null || p <= topPass) return;
    topPass = p;
    passEl.textContent = "pass " + p;
  }

  // Run-level events (pass boundaries, verdict) go to the strip under the
  // header rather than claiming a column, so the columns stay with the agents
  // doing the work and five or six of them fit without scrolling sideways.
  function toHood(ev) {
    const p = ev.payload || {};
    const chip = document.createElement("span");
    chip.className = "chip";
    const label = document.createElement("span");
    label.textContent = String(ev.kind).replace(/_/g, " ");
    const value = document.createElement("b");
    // The pass number lives on the envelope, not in the payload — pass_started
    // carries only its lens list, so reading the payload alone printed a bare
    // "pass started" chip with nothing to say which pass had started.
    const p1 = passOf(ev);
    value.textContent =
      p.verdict ??
      p.error ??
      (p.findings !== undefined
        ? `${p.findings} findings`
        : p1 !== null
          ? `pass ${p1}`
          : "");
    if (p.verdict === "clean") chip.className = "chip good";
    if (p.error || p.verdict === "failed" || p.verdict === "ceiling_reached")
      chip.className = "chip bad";
    chip.append(label);
    if (String(value.textContent)) chip.append(value);
    hood.append(chip);
  }

  // Within a line or so of the tail counts as "at the tail" — an exact
  // comparison loses to sub-pixel scroll heights and stops following.
  const nearBottom = (n) => n.scrollHeight - n.scrollTop - n.clientHeight < 40;

  function laneFor(name, actor) {
    if (lanes.has(name)) return lanes.get(name);
    el.querySelector(".empty")?.remove();

    const [who, role] = String(name).split(":");
    const wrap = document.createElement("section");
    wrap.className = "lane";
    wrap.dataset.actor = actor || who || "trio";

    const h = document.createElement("h2");
    const dot = document.createElement("span");
    dot.className = "dot";
    const nm = document.createElement("span");
    nm.className = "name";
    nm.textContent = role || who;
    const rl = document.createElement("span");
    rl.className = "role";
    rl.textContent = role ? who : "";
    const pb = document.createElement("span");
    pb.className = "lane-pass";
    const tk = document.createElement("span");
    tk.className = "tokens";
    h.append(dot, nm, rl, pb, tk);

    const body = document.createElement("div");
    body.className = "events";

    // Following the tail is state the reader owns, not something to re-derive
    // from the scroll position on every append. Re-deriving it is what broke:
    // anything that moves the tail without the reader touching the lane — a
    // new lane arriving and narrowing every column, the hood wrapping to a
    // second line, the window resizing — leaves the old scrollTop mid-stream,
    // which reads as "the reader scrolled up" and the lane never follows
    // again. Every lane starts out following; only the reader stops it.
    const lane = {
      body,
      tokens: tk,
      wrap,
      badge: pb,
      pass: null,
      follow: true,
      pin() {
        body.scrollTop = body.scrollHeight;
      },
    };

    const jump = document.createElement("button");
    jump.type = "button";
    jump.className = "jump";
    jump.textContent = "↓ latest";
    jump.addEventListener("click", () => {
      lane.follow = true;
      wrap.classList.remove("detached");
      lane.pin();
    });

    // The reader's own scrolling is the only thing that stops a lane
    // following, and scrolling back to the tail starts it again. Pinning
    // assigns scrollTop and fires this too, but it lands at the tail, so it
    // only ever confirms what is already true.
    body.addEventListener("scroll", () => {
      const at = nearBottom(body);
      if (at === lane.follow) return;
      lane.follow = at;
      wrap.classList.toggle("detached", !at);
    });

    // A resize moves the tail out from under a lane without any scrolling: the
    // viewport shrinks, the same scrollTop is suddenly short of the bottom.
    // A following lane rides that back down instead of silently falling behind.
    new ResizeObserver(() => {
      if (lane.follow) lane.pin();
    }).observe(body);

    wrap.append(h, body, jump);
    el.append(wrap);

    lanes.set(name, lane);
    return lane;
  }

  // A rule in the stream wherever the pass changes, and the lane's own badge
  // moved to match. Called for every event a lane renders, including the
  // first, so a lane that only starts producing in pass 2 still says so.
  function markPass(lane, ev) {
    const p = passOf(ev);
    if (p === null || p === lane.pass) return;
    lane.pass = p;
    lane.badge.textContent = "p" + p;
    const rule = document.createElement("div");
    rule.className = "pass-rule";
    rule.textContent = "pass " + p;
    lane.body.append(rule);
  }

  function render(ev) {
    const p = ev.payload || {};
    // Before the trio-lane branch below returns: pass_started is a trio event,
    // and it is the one that announces a new pass has begun.
    notePass(ev);
    if ((ev.lane || "") === "trio" || ev.actor === "trio") {
      toHood(ev);
      meta.textContent = `${++count} events · ${lanes.size} lanes`;
      return;
    }
    const lane = laneFor(ev.lane || "unknown", ev.actor);

    // Before the usage return below, not after it. A lens whose first event in
    // a new pass is its token count would otherwise never get that pass's rule
    // or badge — the lane would sit showing the pass before it.
    markPass(lane, ev);

    // Token usage belongs in the lane header, not the event stream.
    if (ev.kind === "usage") {
      lane.tokens.textContent = `${p.input_tokens || 0} in / ${p.output_tokens || 0} out`;
      if (lane.follow) lane.pin();
      meta.textContent = `${++count} events · ${lanes.size} lanes`;
      return;
    }

    const node = document.createElement("div");
    node.className = "ev";

    if (ev.kind === "agent_message") {
      // A lens reports findings as "<severity> · <file:line> — …"; surface the
      // severity as a pill so the stream is scannable.
      const text = p.text || "";
      const sev = /^(critical|major|minor|info)\s+·\s+/.exec(text);
      if (sev) {
        const pill = document.createElement("span");
        pill.className = "sev sev-" + sev[1];
        pill.textContent = sev[1];
        node.append(pill, document.createTextNode(text.slice(sev[0].length)));
      } else {
        node.textContent = text;
      }
    } else if (ev.kind === "reasoning") {
      node.className = "ev reasoning";
      node.textContent = p.text || "";
    } else if (ev.kind === "command_execution") {
      node.className = "ev cmd";
      const sig = document.createElement("span");
      sig.className = "sigil";
      sig.textContent = "$ ";
      const cmd = document.createElement("span");
      cmd.textContent = p.command || "";
      node.append(sig, cmd);
      const code = p.exit_code;
      if (code !== null && code !== undefined) {
        const badge = document.createElement("span");
        badge.className = "exit " + (code === 0 ? "exit-0" : "exit-bad");
        badge.textContent = "exit " + code;
        node.append(badge);
      }
    } else if (ev.kind === "file_change") {
      const f = document.createElement("span");
      f.className = "file";
      f.textContent = (ev.actor === "claude" ? "✎ " : "") + (p.file || "");
      node.append(f);
      if (ev.actor !== "claude") {
        const d = document.createElement("div");
        d.className = "diff";
        for (const line of String(p.diff || "").split("\n")) {
          const t = line.startsWith("+")
            ? "ins"
            : line.startsWith("-")
              ? "del"
              : "span";
          const n = document.createElement(t);
          n.textContent = line;
          d.append(n);
        }
        node.append(d);
      }
    } else {
      const k = document.createElement("span");
      k.className = "kind" + (p.error ? " err" : "");
      k.textContent = ev.kind + " " + (p.error || p.tool || p.agent_type || "");
      node.append(k);
    }

    lane.body.append(node);
    // The append is what makes the lane taller, so the pin comes after it. A
    // lane the reader has scrolled up in keeps its place and keeps its button.
    if (lane.follow) lane.pin();
    meta.textContent = `${++count} events · ${lanes.size} lanes`;
  }

  const src = new EventSource("/events");
  src.onmessage = (m) => {
    try {
      render(JSON.parse(m.data));
    } catch {}
  };
  src.onerror = () => {
    meta.textContent = "disconnected";
    meta.className = "off";
  };
  src.onopen = () => {
    meta.className = "";
  };
</script>
